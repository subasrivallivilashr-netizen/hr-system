<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR System — Login</title><link rel="stylesheet" href="assets/app.css"></head>
<body>
<div class="login-wrap"><form class="login" id="f">
  <img id="lgLogo" class="login-logo hidden" alt=""><h1 id="lgName">HR System</h1><p>Sign in to continue</p>
  <label for="u">Username</label><input id="u" autocomplete="username" required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="btn block" id="b">Sign in</button>
  <div class="msg" id="m"></div>
</form><div class="login-foot"><span class="credit">Powered by <i></i><b>C&amp;B</b></span></div></div>
<script src="assets/app.js"></script>
<script>
const HOME = { SuperAdmin: 'org.html', Admin: 'org.html', HR: 'org.html', Manager: 'org.html' };
if (Session.get()) location.href = HOME[Session.get().role] || 'org.html';
api('getBrandPublic').then(b => {
  if (b.companyName) { $('#lgName').textContent = b.companyName; document.title = b.companyName + ' — Login'; }
  if (b.logo) { $('#lgLogo').src = b.logo; $('#lgLogo').alt = (b.companyName || 'Company') + ' logo'; $('#lgLogo').classList.remove('hidden'); }
}).catch(() => {});
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('#b'); b.disabled = true; b.textContent = 'Signing in…';
  try {
    const d = await api('login', { username: $('#u').value, password: $('#p').value });
    Session.set({ token: d.token, role: d.role, name: d.fullName, stores: d.stores, empId: d.empId, company: d.company, logo: d.logo || '', modules: d.modules, exp: Date.now() + 12 * 3600e3 });
    location.href = HOME[d.role] || 'org.html';
  } catch (err) { showMsg($('#m'), err.message); b.disabled = false; b.textContent = 'Sign in'; }
});
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title><link rel="stylesheet" href="assets/app.css"></head>
<body>
<header class="top" id="top"></header>
<main>
  <div class="tabs" id="tabs">
    <button data-t="company" class="on">Company</button>
    <button data-t="ids">Employee ID</button>
    <button data-t="stores">Stores</button>
    <button data-t="users">Users</button>
    <button data-t="me">My password</button>
  </div>

  <section id="t-company" class="card">
    <h2>Company</h2><p class="sub">Basic details used across the app.</p>
    <div class="grid">
      <div><label>Company name</label><input id="CompanyName"></div>
      <div><label>Probation period (days)</label><input id="ProbationDays" type="number" min="0"></div>
      <div><label>Org structure</label><select id="SameStructureAllStores"><option value="Yes">Same for all stores</option><option value="No">Different per store</option></select></div>
      <div><label>Store limit <span id="limHint" style="font-weight:400;color:var(--muted)"></span></label><input id="StoreLimit" type="number" min="1"></div>
    </div>
    <div class="row-end"><span class="msg" id="m-company"></span><button class="btn" data-save="company">Save</button></div>
  </section>

  <section id="t-ids" class="card hidden">
    <h2>Employee ID format</h2><p class="sub">How new employee numbers are generated.</p>
    <div class="grid">
      <div><label>Prefix</label><input id="EmpIdPrefix" placeholder="EMP-"></div>
      <div><label>Number of digits</label><input id="EmpIdDigits" type="number" min="2" max="8"></div>
      <div><label>Next number</label><input id="EmpIdNextNumber" type="number" min="1"></div>
      <div><label>Numbering</label><select id="EmpIdPerStore"><option value="No">Across whole company</option><option value="Yes">Separate per store (store code added)</option></select></div>
    </div>
    <div class="preview">Next ID will look like: <b id="idPrev"></b></div>
    <div class="row-end"><span class="msg" id="m-ids"></span><button class="btn" data-save="ids">Save</button></div>
  </section>

  <section id="t-stores" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h2>Stores & locations</h2><p class="sub" id="storeCount"></p></div><button class="btn" id="addStore">+ Add location</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>City</th><th>Common structure</th><th>Active</th><th></th></tr></thead><tbody id="storeRows"></tbody></table></div>
  </section>

  <section id="t-users" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h2>Users</h2><p class="sub">People who can log in.</p></div><button class="btn" id="addUser">+ Add user</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Stores</th><th>Employee</th><th>Active</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div>
  </section>

  <section id="t-me" class="card hidden" style="max-width:420px">
    <h2>Change my password</h2>
    <label>Current password</label><input id="op" type="password">
    <label>New password (min 8)</label><input id="np" type="password">
    <div class="row-end"><span class="msg" id="m-me"></span><button class="btn" id="chg">Change</button></div>
  </section>
</main>

<dialog id="dStore"><form method="dialog" id="fStore">
  <h3 id="dStoreT">Location</h3>
  <div class="grid">
    <div><label>Code</label><input name="StoreCode" required></div>
    <div><label>Name</label><input name="StoreName" required></div>
    <div><label>Type</label><select name="Type"><option>Store</option><option>Warehouse</option><option>Head Office</option></select></div>
    <div><label>City</label><input name="City"></div>
    <div><label>Uses common structure</label><select name="UsesCommonStructure"><option>Yes</option><option>No</option></select></div>
    <div><label>Active</label><select name="Active"><option>Yes</option><option>No</option></select></div>
  </div>
  <div class="row-end"><span class="msg" id="m-store"></span><button value="cancel" formnovalidate>Cancel</button><button class="btn" id="sStore">Save</button></div>
</form></dialog>

<dialog id="dUser"><form method="dialog" id="fUser">
  <h3 id="dUserT">User</h3>
  <div class="grid">
    <div><label>Full name</label><input name="FullName" required></div>
    <div><label>Username (email)</label><input name="Username" required></div>
    <div><label>Role</label><select name="Role" id="roleSel"></select></div>
    <div><label>Stores (codes, or ALL)</label><input name="StoreCodes" value="ALL"></div>
    <div style="grid-column:1/-1"><label>Linked employee <span style="font-weight:400;color:var(--muted)">(needed for managers: their team = people reporting to this employee)</span></label><select name="EmpId" id="empSel"></select></div>
    <div><label>Active</label><select name="Active"><option>Yes</option><option>No</option></select></div>
    <div><label id="pwL">Password (min 8)</label><input name="Password" type="password"></div>
  </div>
  <div class="row-end"><span class="msg" id="m-user"></span><button value="cancel" formnovalidate>Cancel</button><button class="btn" id="sUser">Save</button></div>
</form></dialog>

<script src="assets/app.js"></script>
<script>
const S = guard(['SuperAdmin', 'Admin']);
let DATA = null;
renderTop('settings');
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hidden', s.id !== 't-' + b.dataset.t));
});

async function load() {
  DATA = await api('getSettings');
  const c = DATA.company;
  ['CompanyName','ProbationDays','SameStructureAllStores','StoreLimit','EmpIdPrefix','EmpIdDigits','EmpIdNextNumber','EmpIdPerStore']
    .forEach(k => { if ($('#' + k)) $('#' + k).value = c[k] ?? ''; });
  setCompanyName(c.CompanyName);
  const isSuper = S.role === 'SuperAdmin';
  $('#StoreLimit').disabled = !isSuper;
  $('#limHint').textContent = isSuper ? '' : '(set by Super Admin)';
  idPreview(); renderStores(); renderUsers();
}

function idPreview() {
  const n = String($('#EmpIdNextNumber').value || 1).padStart(Number($('#EmpIdDigits').value || 4), '0');
  const storePart = $('#EmpIdPerStore').value === 'Yes' ? 'STR01-' : '';
  $('#idPrev').textContent = ($('#EmpIdPrefix').value || '') + storePart + n;
}
['EmpIdPrefix','EmpIdDigits','EmpIdNextNumber','EmpIdPerStore'].forEach(k => $('#' + k).addEventListener('input', idPreview));

document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
  const which = b.dataset.save, m = $('#m-' + which);
  const keys = which === 'company' ? ['CompanyName','ProbationDays','SameStructureAllStores','StoreLimit'] : ['EmpIdPrefix','EmpIdDigits','EmpIdNextNumber','EmpIdPerStore'];
  const values = {}; keys.forEach(k => { if (!$('#' + k).disabled) values[k] = $('#' + k).value; });
  b.disabled = true;
  try { await api('saveCompany', { values }); showMsg(m, 'Saved', true); await load(); } catch (e) { showMsg(m, e.message); }
  b.disabled = false;
});

const pill = v => `<span class="pill ${v === 'No' ? 'no' : 'yes'}">${esc(v || 'Yes')}</span>`;
function renderStores() {
  const st = DATA.stores, lim = DATA.company.StoreLimit;
  const n = st.filter(s => s.Type === 'Store' && s.Active !== 'No').length;
  $('#storeCount').textContent = `${n} of ${lim || '∞'} stores used (warehouses and offices don't count)`;
  $('#storeRows').innerHTML = st.length ? st.map((s, i) => `<tr><td><b>${esc(s.StoreCode)}</b></td><td>${esc(s.StoreName)}</td><td>${esc(s.Type)}</td><td>${esc(s.City)}</td><td>${pill(s.UsesCommonStructure)}</td><td>${pill(s.Active)}</td><td><button data-es="${i}">Edit</button></td></tr>`).join('')
    : '<tr><td colspan="7" style="color:var(--muted)">No locations yet. Add your first one.</td></tr>';
  document.querySelectorAll('[data-es]').forEach(b => b.onclick = () => openStore(st[b.dataset.es]));
}
function renderUsers() {
  $('#userRows').innerHTML = DATA.users.map((u, i) => `<tr><td>${esc(u.FullName)}</td><td>${esc(u.Username)}</td><td>${esc(u.Role)}</td><td>${esc(u.StoreCodes)}</td><td>${esc(u.EmpId || '—')}</td><td>${pill(u.Active)}</td><td>${u.Role === 'SuperAdmin' && S.role !== 'SuperAdmin' ? '' : `<button data-eu="${i}">Edit</button>`}</td></tr>`).join('');
  document.querySelectorAll('[data-eu]').forEach(b => b.onclick = () => openUser(DATA.users[b.dataset.eu]));
}

function fill(form, obj) { [...form.elements].forEach(el => { if (el.name) el.value = obj[el.name] ?? (el.tagName === 'SELECT' ? el.options[0].value : ''); }); }
function read(form) { const o = {}; [...form.elements].forEach(el => { if (el.name) o[el.name] = el.value.trim(); }); return o; }

function openStore(s) {
  const f = $('#fStore'); fill(f, s || {}); f.StoreCode.readOnly = !!s;
  $('#dStoreT').textContent = s ? 'Edit location' : 'Add location'; $('#m-store').textContent = '';
  $('#dStore').showModal();
}
$('#addStore').onclick = () => openStore(null);
$('#sStore').onclick = async e => {
  e.preventDefault(); const f = $('#fStore'); if (!f.reportValidity()) return;
  try { await api('saveStore', { store: read(f) }); $('#dStore').close(); await load(); } catch (err) { showMsg($('#m-store'), err.message); }
};

function openUser(u) {
  const roles = S.role === 'SuperAdmin' ? ['SuperAdmin','Admin','HR','Manager'] : ['Admin','HR','Manager'];
  $('#roleSel').innerHTML = roles.map(r => `<option>${r}</option>`).join('');
  $('#empSel').innerHTML = '<option value="">— Not linked —</option>' + (DATA.employees || []).map(e => `<option value="${esc(e.EmpId)}">${esc(e.EmpId)} · ${esc(e.FullName)} · ${esc(e.StoreCode)}</option>`).join('');
  const f = $('#fUser'); fill(f, u || { StoreCodes: 'ALL' }); f.Username.readOnly = !!u; f.Password.value = '';
  $('#pwL').textContent = u ? 'New password (leave blank to keep)' : 'Password (min 8)';
  $('#dUserT').textContent = u ? 'Edit user' : 'Add user'; $('#m-user').textContent = '';
  $('#dUser').showModal();
}
$('#addUser').onclick = () => openUser(null);
$('#sUser').onclick = async e => {
  e.preventDefault(); const f = $('#fUser'); if (!f.reportValidity()) return;
  const u = read(f); if (!u.Password) delete u.Password;
  try { await api('saveUser', { user: u }); $('#dUser').close(); await load(); } catch (err) { showMsg($('#m-user'), err.message); }
};

$('#chg').onclick = async () => {
  try { await api('changeMyPassword', { oldPassword: $('#op').value, newPassword: $('#np').value }); showMsg($('#m-me'), 'Password changed', true); $('#op').value = $('#np').value = ''; }
  catch (e) { showMsg($('#m-me'), e.message); }
};

if (S) load().catch(e => alert(e.message));
</script></body></html>
